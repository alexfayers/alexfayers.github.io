name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *" # every morning, UTC
  workflow_dispatch:

env:
  # Folder the redesign is built into, next to the old site at the root.
  # Set to "" to publish the redesign at the root instead.
  REDESIGN_PATH: new
  # Folder for the clean version of the redesign.
  CLEAN_PATH: clean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          mkdir _site
          cp CNAME _site/
          if [ -n "$REDESIGN_PATH" ]; then
            cp -r index.html assets _site/
            python3 build.py --out "_site/$REDESIGN_PATH/index.html"
            python3 build.py --template template-clean.html --out "_site/$CLEAN_PATH/index.html"
          else
            python3 build.py --out _site/index.html
          fi
        env:
          # The default token can only read this repo and public data.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
